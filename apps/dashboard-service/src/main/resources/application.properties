# Application
spring.application.name=Dashboard-Service
server.port=8083

# MongoDB (raw click events for reactive streaming)
spring.data.mongodb.uri=mongodb://localhost:27017/url-shortner-db

# ClickHouse (analytics aggregation queries)
spring.datasource.url=jdbc:clickhouse://localhost:8123/url_shortener
spring.datasource.driver-class-name=com.clickhouse.jdbc.ClickHouseDriver
