<nav class="navbar">
  <a routerLink="/" class="brand">Short.ly</a>

  <div class="nav-links">
    <a routerLink="/">Overview</a>
    @if (isAuthenticated()) {
      <a routerLink="/dashboard">Dashboard</a>
    }
  </div>

  <div class="nav-actions">
    @if (isAuthenticated()) {
      <div class="tenant-chip">
        <span>{{ tenantLabel() }}</span>
        <small>{{ user()?.email }}</small>
      </div>
      <button type="button" class="ghost-button" (click)="logout()">Logout</button>
    } @else {
      <a routerLink="/login" class="ghost-button">Login</a>
    }
  </div>
</nav>
